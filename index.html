<div id='fullwindow'></div>
<div class="grid-container">

		<div class="grid-align-bottom-right grid-padding">
			I like to design and code websites, writings coming soon.
		</div>

</div>
<section id="main">
	<div id="breadcrumbs">
		<ul class="nav-level">
			<!-- <li><a href="/">Portfolio</a></li> -->
		</ul>
	</div>
    <div id='content'>
		<div id='columns'>
		</div>
		<div id="project-preview">
			<img id="preview-blsclone" class="project-image" src="projectImages/blsclone.png" alt="BLSclone">
			<img id="preview-yukon" class="project-image" src="projectImages/yukon.png" alt="Yukon">
			<img id="preview-kodak" class="project-image" src="projectImages/kodak.png" alt="Kodak">
			<img id="preview-newjeans" class="project-image" src="projectImages/newjeans.png" alt="Newjeans">
		</div>
    </div>
</section>

<button id="grid-toggle" title="Toggle gridlines">Show Grid</button>
<script type="text/javascript" src="screenfull.js"></script>	
<script type="text/javascript" src="windowfull.js"></script>	
<script>
    var imgs = document.querySelectorAll('img,video');
	var i;
	var index;
	for (i = 0; i < imgs.length; i++) {
		if (screenfull.isEnabled) {
    		imgs[i].addEventListener('click', function () {
                screenfull.toggle(this);
    		}, false);
		} else {
    		imgs[i].addEventListener('click', function () {
                windowfull.toggle(this);
    		}, false);
        }
	}

    // Project image hover reveal
    const projectLinks = {
        'https://asjeon.vercel.app/blsclone': 'preview-blsclone',
        'https://asjeon.vercel.app/yukon': 'preview-yukon',
        'https://asjeon.vercel.app/kodak': 'preview-kodak',
        'https://asjeon.vercel.app/NewJeans': 'preview-newjeans'
    };

    const projectImages = document.querySelectorAll('.project-image');
    
    // Get all navigation links in the nav-level
    const navLinks = document.querySelectorAll('#menu .nav-level a');
    
    navLinks.forEach(link => {
        const href = link.getAttribute('href');
        const imageId = projectLinks[href];
        
        if (imageId) {
            const targetImage = document.getElementById(imageId);
            
            link.addEventListener('mouseenter', function() {
                // Remove active class from all images
                projectImages.forEach(img => img.classList.remove('active'));
                // Add active class to target image
                if (targetImage) {
                    targetImage.classList.add('active');
                }
            });
            
            link.addEventListener('mouseleave', function() {
                // Remove active class when mouse leaves
                if (targetImage) {
                    targetImage.classList.remove('active');
                }
            });
        }
    });

    // Grid toggle functionality
    const gridToggle = document.getElementById('grid-toggle');
    const body = document.body;
    
    if (gridToggle) {
        // Check localStorage for saved preference (default is hidden)
        const gridVisible = localStorage.getItem('gridVisible') === 'true';
        if (gridVisible) {
            body.classList.add('show-gridlines');
            gridToggle.textContent = 'Hide Grid';
        }
        
        gridToggle.addEventListener('click', function() {
            body.classList.toggle('show-gridlines');
            const isVisible = body.classList.contains('show-gridlines');
            gridToggle.textContent = isVisible ? 'Hide Grid' : 'Show Grid';
            localStorage.setItem('gridVisible', isVisible);
        });
    }
</script>
<div id="badge-container" class="lower-right">
    	    <div id='badge' class='small badge'>
                <canvas class='centre'>loading...</canvas>            </div>
    	</div>
	</body>
</html>
